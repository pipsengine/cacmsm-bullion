name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/_shared
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/control-api/requirements.txt
          python -m pip install -r services/market-data-service/requirements.txt
          python -m pip install -r services/decision-service/requirements.txt
          python -m pip install -r services/execution-service/requirements.txt
          python -m pip install -r services/monitoring-service/requirements.txt

      - name: Run tests
        env:
          JSON_LOGS: "false"
        run: |
          pytest -q

